/* Layout concept: a story in two papers — a lined school notebook (the past) and a clean exam draft on a sage desk (the present); one focused task per screen, the course commander beside it. */
:root{
  color-scheme:light;
  --cream:#F7F2E9;--paper:#FFFDF8;--sand:#F1E8D8;--line:#E6DCCB;
  --sage:#D5E5C6;--sage2:#AFCB9C;--green:#4F7C4B;--forest:#2D4A31;
  --coral:#E8957A;--coral-d:#C4654A;--coral-l:#FBE3D9;--brick:#8B4A3A;
  --ink:#3A2B26;--muted:#7C6D65;--pencil:#2F3A5A;--pencil-l:#6B7390;--blue-line:#C9DBEA;--margin:#E4A3A3;--red:#C43C3C;
  --white:#FFFFFF;--shadow:rgba(58,43,38,.28);
  --f-body:'Heebo','Segoe UI',Arial,sans-serif;--f-hand:'Hand','Heebo',cursive;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;direction:rtl;background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
#app{min-height:100%}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--forest);color:var(--white);border:0;border-radius:14px;padding:14px 26px;font-size:17px;font-weight:700;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.4;cursor:default;transform:none}

/* ===== entry ===== */
.entry{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);min-height:100vh}
.entry .content{padding:64px 64px 48px 40px;display:flex;flex-direction:column;gap:0;min-width:0}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--green);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--coral)}
.entry h1{font-size:clamp(48px,6.4vw,84px);line-height:.98;font-weight:900;margin:20px 0 18px;letter-spacing:-.02em}
.entry h1 em{font-style:normal;color:var(--coral-d)}
.lead{font-size:19px;line-height:1.55;color:var(--muted);max-width:30em}
.form{margin-top:30px;display:grid;gap:18px}
.field label,.field .lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:7px}
.input{height:50px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:0 16px;font:500 18px var(--f-body);width:min(320px,100%);color:var(--ink)}
.seg{display:inline-flex;background:var(--sand);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{white-space:nowrap;padding:9px 16px;border-radius:9px;font-size:15px;font-weight:500;color:var(--muted);background:transparent;border:0;cursor:pointer}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 1px 3px var(--shadow)}
.row2{display:flex;gap:24px;flex-wrap:wrap}
.start{margin-top:auto;padding-top:28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.time{font-size:14px;color:var(--muted)}
.resume{margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.resume b{font-size:15px}
.art{position:relative;background:var(--sage);overflow:hidden;min-height:520px}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,#E3EED8 0,transparent 55%)}
.sheet{position:absolute;width:310px;height:410px;border-radius:6px;box-shadow:0 18px 40px rgba(45,74,49,.22),0 2px 6px rgba(45,74,49,.12)}
.sheet.old{right:34%;top:12%;transform:rotate(-7deg);background:#FFFEFA repeating-linear-gradient(#FFFEFA 0 31px,var(--blue-line) 31px 32px);background-position:0 70px}
.sheet.old::before{content:"";position:absolute;top:0;bottom:0;right:44px;width:2px;background:var(--margin)}
.sheet.old .h{font-family:var(--f-hand);font-weight:700;font-size:34px;color:var(--pencil);position:absolute;top:18px;right:60px}
.sheet.old .scrib{position:absolute;right:60px;left:30px;font-family:var(--f-hand);font-weight:700;font-size:26px;color:var(--pencil);line-height:32px;top:102px}
.grade{position:absolute;left:26px;top:22px;width:84px;height:84px;border:3px solid var(--red);border-radius:50%;display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:46px;color:var(--red);transform:rotate(-12deg)}
.x{color:var(--red)}
.sheet.new{right:7%;top:30%;transform:rotate(5deg);background:var(--paper);padding:26px 28px}
.tag{display:inline-block;background:var(--coral-l);color:var(--coral-d);font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.sheet.new h3{font-size:21px;font-weight:800;margin:12px 0 4px}
.sheet.new .meta{font-size:12px;color:var(--muted);margin-bottom:16px}
.bar{height:10px;border-radius:5px;background:var(--sand);margin:9px 0}
.qline{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:13px;font-weight:700;color:var(--green)}
.qline i{width:22px;height:22px;border-radius:6px;background:var(--sage);display:grid;place-items:center;font-style:normal;font-size:12px}
.journey{position:absolute;bottom:28px;right:28px;left:28px;display:flex;gap:10px;z-index:2}
.journey div{flex:1;background:rgba(255,253,248,.88);border-radius:14px;padding:12px 14px;min-width:0}
.journey b{display:block;font-size:12px;color:var(--coral-d);font-weight:800;letter-spacing:.06em}
.journey span{font-size:15px;font-weight:700;display:block}
.journey small{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* ===== notebook (act A) ===== */
.nbwrap{min-height:100vh;background:#EAE4D8;padding:28px 16px;display:flex;justify-content:center}
.nb{position:relative;width:min(1040px,100%);min-height:calc(100vh - 56px);background-color:#FFFEFA;border-radius:4px;
  background-image:repeating-linear-gradient(transparent 0 39px,var(--blue-line) 39px 40px);background-position:0 18px;
  box-shadow:0 1px 0 #ddd,0 14px 40px rgba(0,0,0,.14);padding:22px 120px 28px 46px;display:flex;flex-direction:column}
.nb::before{content:"";position:absolute;top:0;bottom:0;right:92px;width:2px;background:var(--margin)}
.holes{position:absolute;right:30px;top:90px;display:grid;gap:190px}
.holes i{width:24px;height:24px;border-radius:50%;background:#EAE4D8;box-shadow:inset 0 2px 3px rgba(0,0,0,.18)}
.nbhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.nbhead .t{font-family:var(--f-hand);font-weight:700;font-size:44px;color:var(--pencil);line-height:1}
.nbhead .t small{display:block;font-size:26px;color:var(--pencil-l);margin-top:4px}
.timer{background:#2F2A28;color:var(--white);border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:12px;transform:rotate(1.5deg)}
.timer .q{font-size:30px;font-weight:900;color:#F2B49F;line-height:1}
.timer span{font-size:13px;line-height:1.3;opacity:.85}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-top:36px}
.qnum{font-size:14px;font-weight:700;color:var(--pencil-l);letter-spacing:.04em}
.dots{display:flex;gap:7px}
.dots i{width:9px;height:9px;border-radius:50%;background:#D8D2C4}
.dots i.on{background:var(--pencil)}
.dots i.done{background:#9AA2BC}
.qbody{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;margin-top:14px;align-items:start}
.qtext{font-size:clamp(24px,3vw,34px);font-weight:800;color:#1F2433;line-height:1.3}
.qtext .soft{font-weight:800}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:16px;min-height:52px;padding:8px 18px;border-radius:12px;font-size:20px;font-weight:500;color:#1F2433;background:transparent;border:0;text-align:right;cursor:pointer}
.opt:hover{background:rgba(201,219,234,.35)}
.opt .c{width:34px;height:34px;border:2px solid #9AA2BC;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--pencil-l);flex:none}
.opt.sel{background:rgba(201,219,234,.55)}
.opt.sel .c{background:var(--pencil);border-color:var(--pencil);color:var(--white)}
.opts.locked .opt{cursor:default}
.blankin{font:700 22px var(--f-hand);font-size:30px;color:var(--pencil);border:0;border-bottom:2px solid var(--pencil-l);background:transparent;width:180px;text-align:center;margin:0 6px;padding:0 4px}
.openin{width:100%;min-height:150px;margin-top:18px;border:0;background:transparent;font:700 30px/40px var(--f-hand);color:var(--pencil);resize:none;padding:0;background-image:none}
.thought{position:relative;background:var(--white);border-radius:22px;padding:18px 20px;box-shadow:0 8px 24px rgba(31,36,51,.12);transform:rotate(-2deg);margin-top:40px;animation:pop .35s ease}
.thought p{font-family:var(--f-hand);font-weight:700;font-size:30px;line-height:1.05;color:var(--pencil)}
.thought::after{content:"";position:absolute;bottom:-24px;right:60px;width:20px;height:20px;border-radius:50%;background:var(--white);box-shadow:0 6px 14px rgba(31,36,51,.1)}
.nbfoot{margin-top:auto;padding-top:26px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.scars{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--brick);background:var(--coral-l);padding:9px 14px;border-radius:99px}
.scars svg,.scar svg{width:16px;height:16px;flex:none}
.pbtn{background:var(--pencil)}
.story p{font-family:var(--f-hand);font-weight:700;font-size:clamp(30px,3.6vw,40px);line-height:1.15;color:var(--pencil);max-width:22em}
.story p+p{margin-top:16px}
.story .hl{font-size:clamp(44px,6vw,64px);color:#1F2433}
.timeup{position:fixed;inset:0;background:rgba(31,36,51,.82);display:grid;place-items:center;z-index:20;animation:fade .3s}
.timeup .card{background:var(--white);border-radius:24px;padding:34px 40px;text-align:center;max-width:460px;margin:16px;transform:rotate(-1.5deg)}
.timeup h2{font-size:44px;font-weight:900;color:var(--red)}
.timeup p{font-size:18px;color:var(--muted);margin:10px 0 22px}
.debrief{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 34px;margin-top:22px}
.dq{border-bottom:1px dashed #CBD3E0;padding-bottom:10px}
.dq .s{font-size:15px;color:#3A4058;font-weight:500}
.dq .r svg{width:22px;height:22px;flex:none}
.dq .r{font-family:var(--f-hand);font-weight:700;font-size:27px;color:var(--red);line-height:1.05;margin-top:4px;display:flex;gap:8px;align-items:center}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);border-radius:12px;padding:6px 14px;font-weight:900;font-size:20px;transform:rotate(-4deg)}

/* ===== transition ===== */
.trans{min-height:100vh;background:var(--forest);color:var(--white);display:grid;place-items:center;padding:40px 16px;text-align:center}
.trans .k{font-family:var(--f-hand);font-size:44px;font-weight:700;color:#CFE5BE}
.trans h2{font-size:clamp(34px,5vw,56px);font-weight:900;margin:8px 0 14px}
.trans p{font-size:19px;opacity:.85;max-width:34em;margin:0 auto 28px}
.trans .btn{background:var(--coral);color:#2A1A14}

/* ===== shell (acts B, C) ===== */
.shell{min-height:100vh;display:flex;flex-direction:column;position:relative}
.shell::before{content:"";position:fixed;inset:0;background-image:radial-gradient(#E3D9C8 1.2px,transparent 1.2px);background-size:22px 22px;opacity:.55;pointer-events:none}
.top{position:relative;z-index:2;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 40px}
.act2{font-size:14px;font-weight:700;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act2 b{color:var(--coral-d);font-weight:800}
.prog{display:flex;gap:6px;align-items:center}
.prog i{width:30px;height:5px;border-radius:3px;background:var(--line)}
.prog i.d{background:var(--sage2)}
.prog i.n{background:var(--coral);width:48px}
.tright{display:flex;gap:8px;align-items:center}
.pill{font-size:13px;font-weight:700;color:var(--green);background:var(--paper);border:1px solid var(--line);padding:6px 12px;border-radius:99px;white-space:nowrap}
.pill.btnp{cursor:pointer;color:var(--ink)}
.stage{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:32px;padding:8px 40px 24px;max-width:1300px;width:100%;margin:0 auto}
.mainc{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:0}
.side{display:flex;flex-direction:column;min-width:0;position:sticky;top:8px;align-self:start;height:calc(100vh - 96px);min-height:540px}
.stage.long{align-items:start}
.stage.long .mainc{justify-content:flex-start}

.chap{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.chap .ic{width:42px;height:42px;border-radius:12px;background:var(--coral);display:grid;place-items:center;color:var(--white);flex:none;font-weight:900;font-size:18px}
.chap b{display:block;font-size:22px;font-weight:900;line-height:1.15}
.chap span{font-size:13.5px;color:var(--muted);font-weight:500}
.chap .dots3{margin-right:auto;display:flex;gap:6px}
.chap .dots3 i{width:24px;height:6px;border-radius:3px;background:var(--line)}
.chap .dots3 i.d{background:var(--sage2)}
.chap .dots3 i.n{background:var(--coral)}
.char{background:linear-gradient(180deg,#DCE9CF,#C7DCB5);border-radius:26px;padding:18px 18px 0;position:relative;overflow:hidden;height:100%;display:flex;flex-direction:column}
.sp{background:var(--white);border-radius:18px 18px 18px 4px;padding:13px 16px;font-size:15.5px;line-height:1.5;font-weight:500;position:relative;z-index:3;box-shadow:0 6px 16px -8px rgba(45,74,49,.4);animation:pop .3s ease}
.sp b.who{display:block;font-size:12px;color:var(--green);font-weight:800;margin-bottom:2px}
.fig{flex:1;position:relative;overflow:hidden;margin:0 -18px}
.fig img{position:absolute;top:10px;width:auto;left:50%;transform:translateX(-50%);max-width:none;filter:drop-shadow(0 10px 18px rgba(45,74,49,.25));animation:rise .35s ease}
.tools{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:14px 16px}
.tools h4{margin:0 0 10px;font-size:13px;font-weight:800;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.tools h4 button{background:none;border:0;color:var(--coral-d);font-weight:800;font-size:13px;cursor:pointer;padding:0}
.stk{border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:700;margin-bottom:7px;line-height:1.35}
.stk small{display:block;font-size:11px;font-weight:800;opacity:.7}
.stk.a{background:#E7F0DD;color:var(--forest);transform:rotate(.8deg)}
.stk.b{background:var(--sand);color:#6A5230;transform:rotate(-1deg)}
.stk.c{background:var(--coral-l);color:var(--brick);transform:rotate(.6deg)}
.stk.empty{border:1.5px dashed #D9CDB9;color:#A89A8A;background:transparent;text-align:center;font-weight:500}
.stk.new{box-shadow:0 0 0 3px var(--white),0 0 0 5px var(--coral);animation:pop .4s ease}
.more-r{font-size:12.5px;color:var(--muted);text-align:center}

/* main content pieces */
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px 24px}
.card h3{font-size:18px;font-weight:800;margin-bottom:6px}
.quote{font-size:19px;line-height:1.6;font-weight:500}
.quote small{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.exam{background:#FFFEFA;border-radius:6px 22px 22px 6px;padding:24px 34px 20px 30px;position:relative;
  box-shadow:0 1px 0 var(--line),0 22px 44px -26px var(--shadow);
  background-image:repeating-linear-gradient(transparent 0 33px,#EEF3F7 33px 34px);background-position:0 60px}
.exam::after{content:"";position:absolute;top:0;bottom:0;right:16px;width:2px;background:#F0C9C2}
.exam .scar{position:absolute;top:-13px;left:26px}
.scar{display:inline-flex;align-items:center;gap:7px;background:var(--coral-l);color:var(--brick);font-size:12.5px;font-weight:800;padding:6px 12px;border-radius:99px}
.exam .num{font-size:13px;font-weight:800;color:#8A93AE;margin-bottom:6px}
.exam .q{font-size:clamp(19px,2.2vw,24px);font-weight:800;color:#1F2433;line-height:1.45}
.exam .q.bad{text-decoration:underline wavy #E08A6E;text-underline-offset:8px;text-decoration-thickness:1.5px}
.exam.done .q{text-decoration:line-through;text-decoration-color:var(--coral-d);text-decoration-thickness:2px;color:#9AA0B4}
.exam ol{list-style:none;display:grid;gap:3px;margin:10px 0 0;padding:0}
.exam li{display:flex;align-items:center;gap:12px;font-size:16.5px;color:#3A4058;min-height:30px}
.exam li i{width:24px;height:24px;border:1.6px solid #A6AEC5;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:#7A839E;flex:none}
.exam.done ol{opacity:.45}
.fixed{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.fixed span{background:#E7F0DD;color:var(--forest);font-weight:700;font-size:16px;padding:8px 14px;border-radius:10px;animation:pop .35s ease}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-top:10px}
.cols2 h5{margin:0;font-size:14px;color:var(--pencil-l);text-decoration:underline}
.cols2 div{font-size:15px;color:#3A4058}
.ask{margin-top:22px}
.askq{font-size:18px;font-weight:800;margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.askq small{font-size:13px;font-weight:500;color:var(--muted)}
.grid{display:grid;gap:10px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c1{grid-template-columns:minmax(0,1fr)}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pk{display:flex;align-items:center;gap:12px;background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;font-size:16px;font-weight:500;text-align:right;cursor:pointer;transition:border-color .15s,transform .15s;line-height:1.4}
.pk:hover:not([disabled]){border-color:var(--ink);transform:translateY(-1px)}
.pk .e{width:30px;height:30px;border-radius:9px;background:var(--cream);display:grid;place-items:center;font-size:14px;font-weight:900;color:var(--muted);flex:none}
.pk.ok{border:2px solid var(--green);box-shadow:0 0 0 4px var(--sage);cursor:default}
.pk.ok .e{background:var(--green);color:var(--white)}
.pk.no{border-color:#E7B4A5;background:#FFF6F2;color:#A0837A;animation:shake .35s}
.pk.no .e{background:var(--coral-l);color:var(--coral-d)}
.pk.dim{opacity:.5;cursor:default}
.pk[disabled]{cursor:default}
.rule{margin-top:12px;background:var(--coral-l);color:var(--brick);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;line-height:1.5;animation:pop .35s ease}
.rule b{font-weight:900}
.meter{direction:ltr;height:14px;border-radius:7px;background:var(--sand);margin:16px 0 6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--coral),var(--sage2))}
.why{margin-top:16px;font-size:16px;line-height:1.6;background:var(--paper);border-right:4px solid var(--green);border-radius:10px;padding:12px 16px;animation:pop .3s ease}
.tip{font-size:14px;color:var(--forest);background:var(--sage);padding:10px 14px;border-radius:12px;line-height:1.5}
.next3{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.next3 .tip{flex:1;min-width:220px;max-width:520px}
.next3 .btn{margin-right:auto}
.rulein{display:inline-flex;align-items:center;gap:8px;background:var(--coral-l);color:var(--brick);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:700;transform:rotate(-1deg);animation:pop .4s ease}
.rulein small{font-size:11px;font-weight:800;opacity:.75;letter-spacing:.04em}
details.more{margin-bottom:14px}
details.more summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--coral-d);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--coral-l)}
details.more[open] summary::before{content:"–"}
details.more .in{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 18px;font-size:14.5px;line-height:1.6}
details.more .in ul{margin:6px 0 0;padding-right:18px}
.pcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.pcard b{display:block;font-size:15px;color:var(--green);margin-bottom:3px}
.pcard span{font-size:13px;color:var(--muted);line-height:1.45;display:block}
.qcard{background:var(--white);border-radius:18px;padding:18px 22px;font-size:18px;font-weight:700;line-height:1.5;box-shadow:0 10px 26px -18px var(--shadow);border:1px solid var(--line);position:relative}
.qcard small{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
.slots{display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px;min-height:46px;border:1.5px dashed #D9CDB9;border-radius:12px;padding:6px 12px;font-size:15.5px;font-weight:600;background:transparent;text-align:right;cursor:pointer}
.slot i{width:26px;height:26px;border-radius:8px;background:var(--sand);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:13px;color:var(--muted);flex:none}
.slot.f{border-style:solid;border-color:var(--line);background:var(--white)}
.slot.bad{border-color:var(--coral-d);background:#FFF6F2}
.slot.good{border-color:var(--green);background:#F1F7EC}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--white);border-radius:99px;padding:9px 15px;font-size:15px;font-weight:500;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--forest);border-color:var(--forest);color:var(--white)}
.chip.miss{border:2px dashed var(--coral-d)}
.chip.wrong{background:var(--coral-l);border-color:var(--coral-d);color:var(--brick)}
.chip.right{background:var(--sage);border-color:var(--green);color:var(--forest);font-weight:700}
.ordwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.lbl2{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:8px}
.tree{display:flex;flex-direction:column;align-items:center;gap:0;margin-top:6px}
.tree .root{background:var(--forest);color:var(--white);font-weight:800;border-radius:12px;padding:9px 18px}
.tree .stem{width:2px;height:16px;background:var(--sage2)}
.tree .branches{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;border-top:2px solid var(--sage2);padding-top:14px}
.tree .branches span{background:var(--coral);color:var(--white);font-weight:700;border-radius:10px;padding:8px 14px;font-size:14.5px;animation:pop .35s ease}
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px}
.pyr div{background:var(--sage);border-radius:10px;padding:8px 12px;text-align:center;font-size:13.5px;line-height:1.35;color:var(--forest)}
.pyr div b{display:block;font-size:15px}
.pyr div:nth-child(1){width:46%;background:#E7F0DD}
.pyr div:nth-child(2){width:62%;background:#D5E5C6}
.pyr div:nth-child(3){width:80%;background:#C3D9AF}
.pyr div:nth-child(4){width:100%;background:#AFCB9C}
.dist{display:grid;gap:10px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 70px 150px;gap:12px;align-items:center;background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
.drow.bad{border-color:var(--coral-d)}
.drow.good{border-color:var(--green)}
.drow b{font-size:16px}
.drow .w{font-size:14px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.step button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-size:20px;font-weight:700;cursor:pointer;line-height:1}
.step span{min-width:28px;text-align:center;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:800;font-size:15px;color:var(--muted)}
.total b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.approved{display:inline-block;border:3px solid var(--green);color:var(--green);border-radius:10px;padding:5px 14px;font-weight:900;font-size:18px;transform:rotate(-5deg);animation:pop .4s ease}
.types9{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.types9 div{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.types9 b{display:block;font-size:15.5px}
.types9 span{font-size:13px;color:var(--muted);line-height:1.4;display:block}
.sheetx{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-top:16px;box-shadow:0 14px 30px -22px var(--shadow)}
.sheetx h5{margin:10px 0 6px;font-size:13px;color:var(--coral-d);letter-spacing:.04em}
.sheetx h5:first-child{margin-top:0}
.sheetx li{font-size:15px;margin-bottom:3px}
.sheetx ul{margin:0;padding-right:18px}
.seq{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:8px}

/* pilot */
.pil{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.feed{background:var(--forest);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;color:var(--white)}
.feed h4{margin:0;font-size:13px;font-weight:800;letter-spacing:.06em;color:#CFE5BE;display:flex;justify-content:space-between}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .a{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;flex:none;color:var(--forest);background:#E9DDC3}
.msg .b{background:rgba(255,255,255,.1);border-radius:4px 16px 16px 16px;padding:9px 13px;font-size:14px;line-height:1.45}
.msg .b small{display:block;font-size:11.5px;opacity:.6;margin-bottom:2px}
.msg.good .b{background:rgba(207,229,190,.22)}
.hist{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px}
.hist b{font-size:12px;color:#CFE5BE;font-weight:800}
.bars{display:flex;align-items:flex-end;gap:7px;height:84px;margin-top:8px;direction:ltr}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:rgba(255,255,255,.7)}
.bars i{width:100%;border-radius:5px 5px 2px 2px;background:var(--coral)}
.item .q{font-size:18px;font-weight:800;line-height:1.45;margin:6px 0 14px}
.item .hd{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--coral-d)}
.item .hd span{color:var(--muted)}
.stats{display:grid;grid-template-columns:130px minmax(0,1fr);gap:18px;align-items:center}
.big{background:var(--cream);border-radius:14px;padding:12px 14px}
.big b{display:block;font-size:12px;color:var(--muted);font-weight:700}
.big span{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.scale b{font-size:12px;color:var(--muted);font-weight:700}
.track{position:relative;height:12px;border-radius:6px;margin:30px 0 8px;background:linear-gradient(90deg,#E9B7A6 0%,#F1E7D8 50%,#BFD6AE 75%,#F1E7D8 100%);direction:ltr}
.track .ideal{position:absolute;left:75%;top:-6px;bottom:-6px;width:2px;background:var(--forest)}
.track .ideal::after{content:"אידיאלי 0.5";position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:800;color:var(--forest);white-space:nowrap}
.track .pin{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;background:var(--coral-d);border:4px solid var(--white);box-shadow:0 2px 8px rgba(0,0,0,.25);transform:translate(-50%,-50%)}
.track .pin span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:900;color:var(--coral-d);white-space:nowrap}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);direction:ltr;margin-top:24px}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.legend div{background:var(--cream);border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.legend b{display:block;color:var(--ink);font-size:13px}

/* epilogue */
.ep{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ep .big span{font-size:34px}
.cheat{margin-top:18px;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:20px 24px}
.cheat h3{font-size:20px;font-weight:900;margin-bottom:4px}
.cheat .grp{margin-top:12px}
.cheat .grp b{font-size:13px;color:var(--coral-d);letter-spacing:.04em}
.cheat ul{margin:4px 0 0;padding-right:18px}
.cheat li{font-size:15px;line-height:1.55}

/* modal */
.modal{position:fixed;inset:0;background:rgba(45,74,49,.45);z-index:30;display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal .box{background:var(--paper);border-radius:22px;max-width:560px;width:100%;max-height:84vh;overflow:auto;padding:22px 24px}
.modal .box h3{font-size:20px;font-weight:900;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.modal .box h3 button{background:var(--sand);border:0;border-radius:10px;width:34px;height:34px;font-size:18px;cursor:pointer}


/* main board: fills the screen next to Roni */
.mainc{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:30px 34px;min-height:calc(100vh - 96px);box-shadow:0 18px 40px -30px var(--shadow)}
.mainc .card,.mainc .pcard,.mainc .types9 div,.mainc .drow,.mainc details.more .in{background:var(--cream)}
.mainc .exam{background-color:#FFFEFA}
.chap b{font-size:26px}
.chap .ic{width:48px;height:48px;font-size:20px}
.askq{font-size:20px}
.pk{padding:15px 18px;font-size:17px}
.qcard{font-size:20px;padding:20px 24px;background:var(--white)}
.exam .q{font-size:clamp(20px,2.3vw,26px)}
.exam li{font-size:17.5px}
.chip{font-size:16px;padding:11px 17px}
.why{font-size:17px}
.sp{font-size:16.5px}
.pyr div{font-size:14.5px;padding:10px 14px}
.pyr div b{font-size:16.5px}
@media (max-width:980px){.mainc{min-height:0;padding:20px 16px;border-radius:20px}}



@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes shake{0%,100%{translate:0}25%{translate:-5px}75%{translate:5px}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== responsive ===== */
@media (max-width:980px){
  .entry{grid-template-columns:1fr}
  .entry .content{padding:36px 20px 28px}
  .art{min-height:460px}
  .sheet{width:250px;height:340px}
  .sheet.old{right:auto;left:8%;top:6%}
  .sheet.new{right:6%;top:22%}
  .stage{grid-template-columns:minmax(0,1fr);padding:8px 16px 28px;gap:14px}
  .side{order:-1}
  .side{position:static;height:auto;min-height:0}
  .tools{display:none}
  .top{padding:0 16px;height:56px}
  .prog{display:none}
  .pcards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .types9{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pil{grid-template-columns:minmax(0,1fr)}
  .nb{padding:18px 18px 24px 18px}
  .nb::before,.holes{display:none}
  .qbody{grid-template-columns:minmax(0,1fr)}
  .thought{margin-top:6px}
  .debrief{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .grid.c2,.grid.c4{grid-template-columns:minmax(0,1fr)}
  .ordwrap{grid-template-columns:minmax(0,1fr)}
  .journey{flex-direction:column;gap:6px;bottom:14px;right:14px;left:14px}
  .journey small{display:none}
  .art{min-height:520px}
  .sheet{width:200px;height:280px;padding:16px!important}
  .sheet.old .scrib{font-size:21px;line-height:26px}
  .drow{grid-template-columns:minmax(0,1fr) auto}
  .drow .w{display:none}
  .stats{grid-template-columns:minmax(0,1fr)}
  .legend,.ep{grid-template-columns:minmax(0,1fr)}
  .exam{padding:22px 18px 18px 18px}
  .exam::after{display:none}
  .act2{font-size:12.5px}
  .tright .pill:first-child{display:none}
}
/* whole figure: bottom-aligned, scaled to fit, never cropped */
.fig{margin:8px 0 0}
.fig img,.fig img[style]{position:absolute;top:auto;bottom:0;left:0;right:0;width:100%;object-fit:contain;object-position:center bottom;transform:none;animation:fadein .35s ease;max-width:100%}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* page recap */
.recap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px;animation:pop .35s ease}
.recap div{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.recap div:last-child{background:#EEF5E8;border-color:#D3E4C6}
.recap b{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--coral-d);margin-bottom:2px}
.recap div:last-child b{color:var(--green)}
.recap p{font-size:15px;line-height:1.5}
.recap.nbr{flex:1;min-width:260px;margin:0}
.recap.tr{text-align:right;margin:0 auto 22px;max-width:640px}
.recap.tr div{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}
.recap.tr b,.recap.tr div:last-child b{color:#CFE5BE}
.chapm{display:none}
@media (max-width:980px){
  .chapm{display:block;position:relative;z-index:2;padding:4px 16px 0}
  .chapm .chap{margin-bottom:8px}
  .chapm .dots3{display:none}
  .pil .feed.evid{order:-1}
  .mainc>.chap{display:none}
  .char{flex-direction:column;align-items:stretch;padding:12px 12px 0}
  .char .sp{margin:0}
  .fig{height:300px;width:auto;flex:none;margin:6px 0 0}
  .fig img,.fig img[style]{animation:none}
}
@media (max-width:620px){.recap{grid-template-columns:minmax(0,1fr)}.recap.nbr{min-width:0}}

@media print{
  .top,.side,.next3,.btn,.shell::before{display:none!important}
  .stage{display:block;padding:0}
  body{background:#fff}
}
</style>

function fresh(){return {name:'',g:'f',role:'nco',i:0,tools:[],fixed:[],ok:0,tot:0,started:false}}
function load(){try{const s=JSON.parse(localStorage.getItem(LS));return s&&typeof s.i==='number'?Object.assign(fresh(),s):null}catch(e){return null}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let S=load()||fresh();
let TIMERS=[];
const app=document.getElementById('app');

/* text helpers: {m|f} gender, {name}, {role} */
function roleLabel(){return S.role==='off'?(S.g==='m'?'קצין צפ"ה':'קצינת צפ"ה'):(S.g==='m'?'מש"ק צפ"ה':'מש"קית צפ"ה')}
function f(s){return String(s).replace(/\{name\}/g,esc(S.name||(S.g==='m'?'חניך':'חניכה'))).replace(/\{role\}/g,roleLabel()).replace(/\{([^{}|]*)\|([^{}]*)\}/g,(m,a,b)=>S.g==='m'?a:b)}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function h(html){const t=document.createElement('template');t.innerHTML=f(html).trim();return t.content.firstElementChild}
function qs(s,r=document){return r.querySelector(s)}
function wait(ms){return new Promise(r=>TIMERS.push(setTimeout(r,ms)))}
function score(first){S.tot++;if(first)S.ok++;save();const p=qs('#fair');if(p)p.textContent=fairText()}
function fair(){return S.tot?Math.round(100*S.ok/S.tot):null}
function fairText(){const v=fair();return 'מד הוגנות · '+(v===null?'—':v+'%')}
function fix(id){if(id&&!S.fixed.includes(id)){S.fixed.push(id);save()}}

/* choose: single-answer task; resolves when correct */
/* place the correct answer at a varied, stable position (not always א) */
let NTH=0;
function hashStr(t){let x=7;for(const ch of String(t))x=(x*31+ch.charCodeAt(0))>>>0;return x}
function order(opts,correct,keep){
 const idx=opts.map((_,i)=>i);if(keep||opts.length<2)return idx;
 const n=opts.length;let target=(hashStr(opts.join('|'))+NTH++)%n;if(target===S.lastPos)target=(target+1+hashStr(opts[0])%(n-1))%n;
 const rest=idx.filter(i=>i!==correct);rest.splice(target,0,correct);return rest;
}
function choose(host,{q,sub='',opts,correct,wrong={},wrongDefault='',cols=2,pose=5,keep=false}){
 return new Promise(res=>{
  const ord=order(opts,correct,keep);S.lastPos=ord.indexOf(correct);
  const box=h(`<div class="ask">${q?`<div class="askq">${q}${sub?`<small>${sub}</small>`:''}</div>`:''}<div class="grid c${cols}">${ord.map((i,k)=>`<button class="pk" data-i="${i}" ${i===correct?'data-ok="1"':''}><span class="e">${'אבגדהוזח'[k]}</span><span>${opts[i]}</span></button>`).join('')}</div></div>`);
  host.append(box);let first=true;
  box.onclick=e=>{const b=e.target.closest('.pk');if(!b||b.disabled)return;const i=+b.dataset.i;
   if(i===correct){score(first);b.classList.add('ok');box.querySelectorAll('.pk').forEach(x=>{x.disabled=true;if(x!==b)x.classList.add('dim')});res(first)}
   else{first=false;b.classList.add('no');b.disabled=true;const w=wrong[i]||wrongDefault;if(w&&CUR)CUR.say(pose,w)}};
 });
}
/* sequence of choose() over items with shared options */
async function sequence(host,items,{opts,cols=2,label=''}){
 const P={4:[2,0,3,1],3:[1,2,0]};
 if(opts&&P[items.length])items=P[items.length].map(i=>items[i]);
 for(let k=0;k<items.length;k++){
  const it=items[k];
  const w=h(`<div><div class="seq">${label} ${k+1} מתוך ${items.length}</div><div class="qcard">${it.small?`<small>${it.small}</small>`:''}${it.t}</div></div>`);
  host.innerHTML='';host.append(w);
  if(it.say&&CUR)CUR.say(it.pose||1,it.say);
  await choose(w,{q:it.q||'',opts:it.opts||opts,correct:it.c,wrong:it.wrong||{},wrongDefault:it.wd||'',cols,keep:!it.opts});
  if(CUR&&it.ok)CUR.say(4,it.ok);
  if(it.rule)addRule(it.rule[0],it.rule[1],w);
  if(it.fix)fix(it.fix);
  if(it.why)why(w,it.why);
  if(k<items.length-1){await waitClick(w,'הבא')}
 }
}
function waitClick(host,label){return new Promise(r=>{const b=h(`<div class="next3"><span></span><button class="btn ghost" id="sq">${label} ${ARROW}</button></div>`);host.append(b);const x=qs('#sq',b);x.focus({preventScroll:true});x.onclick=()=>{b.remove();r()}})}

/* multi-select checklist */
function multi(host,{q,sub='',items,cols=2,hintMissing,hintWrong}){
 return new Promise(res=>{
  const box=h(`<div class="ask"><div class="askq">${q}<small>${sub}</small></div><div class="pool">${items.map((it,i)=>`<button class="chip" data-i="${i}" ${it.ok?'data-ok="1"':''} aria-pressed="false">${it.t}</button>`).join('')}</div>
   <div class="next3" style="margin-top:14px"><span></span><button class="btn ghost" id="chk">בדיקה</button></div></div>`);
  host.append(box);let first=true;
  box.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(c.classList.contains('right'))return;c.classList.toggle('on');c.classList.remove('miss','wrong');c.setAttribute('aria-pressed',c.classList.contains('on'))});
  qs('#chk',box).onclick=()=>{
   let miss=0,bad=0;
   box.querySelectorAll('.chip').forEach(c=>{const ok=!!c.dataset.ok,on=c.classList.contains('on');c.classList.remove('miss','wrong');
    if(ok&&!on){miss++;c.classList.add('miss')} if(!ok&&on){bad++;c.classList.add('wrong')}});
   if(!miss&&!bad){score(first);box.querySelectorAll('.chip').forEach(c=>{c.disabled=true;if(c.dataset.ok){c.classList.remove('on');c.classList.add('right')}});qs('#chk',box).parentElement.remove();res(first)}
   else{first=false;if(CUR)CUR.say(5,bad?hintWrong:hintMissing)}
  };
 });
}
/* tap-to-order */
function orderTask(host,items){
 return new Promise(res=>{
  const n=items.length;const idx=[...Array(n).keys()].sort(()=>Math.random()-.5);
  let slots=[];let first=true;
  const box=h(`<div class="ordwrap"><div><div class="lbl2">{לחץ|לחצי} על השלבים לפי הסדר</div><div class="pool" id="pool"></div></div><div><div class="lbl2">הסדר שלך</div><div class="slots" id="slots"></div></div></div>`);
  host.append(box);
  const draw=(state)=>{
   qs('#pool',box).innerHTML=idx.filter(i=>!slots.includes(i)).map(i=>`<button class="chip" data-k="${i}">${esc(items[i])}</button>`).join('')||'<span style="color:var(--muted);font-size:14px">כל השלבים במקום.</span>';
   qs('#slots',box).innerHTML=Array.from({length:n},(_,j)=>{const v=slots[j];const cls=v===undefined?'':'f'+(state?(v===j?' good':' bad'):'');return `<button class="slot ${cls}" data-j="${j}" ${v===undefined?'disabled':''}><i>${j+1}</i>${v===undefined?'':esc(items[v])}</button>`}).join('');
   box.querySelectorAll('#pool .chip').forEach(c=>c.onclick=()=>{slots.push(+c.dataset.k);draw();check()});
   box.querySelectorAll('.slot.f').forEach(s=>s.onclick=()=>{slots.splice(+s.dataset.j,1);draw()});
  };
  const check=()=>{if(slots.length<n)return;
   const ok=slots.every((v,j)=>v===j);draw(true);
   if(ok){score(first);box.querySelectorAll('button').forEach(b=>b.disabled=true);res(first)}
   else{first=false;if(CUR)CUR.say(5,'כמעט. השלבים באדום לא במקום. {לחץ|לחצי} עליהם כדי להחזיר אותם, ו{נסה|נסי} שוב.');
    TIMERS.push(setTimeout(()=>{slots=slots.map((v,j)=>v===j?v:undefined);const keep=[];slots.forEach((v,j)=>{if(v!==undefined)keep[j]=v});slots=[];for(let j=0;j<n;j++){if(keep[j]===undefined)break;slots.push(keep[j])}draw()},1400))}
  };
  draw();
 });
}

 addRule('הוראות','כלליות: משך (כולל הארכה), בסיס ידע, קריטריונים, בחירה, שיטוט',c.body);
 addRule('הוראות','לכל שאלה: דרך הסימון והניקוד',null);
 nextBtn(c.after,'למערכה ג\': הפיילוט','',['{כתבת|כתבת} הוראות מבחן מלאות, וסגרת את הצלקת האחרונה מכיתה י"א.','מערכה ג\': הפיילוט. 20 טירונים פותרים את המבחן שלך.']);
}

/* ===================== ACT C — pilot ===================== */
function itemCard(o){
 return h(`<div class="card item"><div class="hd">${o.head}<span>${o.idx}</span></div><div class="q">${o.q}</div>
  <div class="stats"><div class="big"><b>דרגת קושי</b><span>${o.p}%</span><small style="display:block;font-size:12px;color:var(--muted)">ענו נכון על השאלה</small></div>
  <div class="scale"><b>אחוז העונים נכון מתוך 20 טירונים</b><div class="meter"><i style="width:${o.p}%"></i></div><div class="ticks"><span>0%</span><span>50%</span><span>100%</span></div></div></div></div>`);
}
const DIFF_CARD=`<div class="card" style="margin-bottom:14px;display:flex;gap:14px;align-items:center"><div class="chap" style="margin:0"><div class="ic" style="background:var(--forest)">%</div></div><div><h3 style="margin:0">דרגת קושי</h3><p style="color:var(--muted)">מבטאת את אחוז העונים נכון על השאלה. ניתוח פריטים עוזר לאתר שאלות שאינן טובות, ולתקן אותן.</p></div></div>`;
async function scrPilot1(){
 const c=stage({act:'ג',step:6,title:'הפיילוט',sub:'20 טירונים פתרו את המבחן שלך',icon:'6',pose:7,
  say:'הרצנו פיילוט. 20 טירונים פתרו את המבחן. עכשיו בודקים כל שאלה לפי דרגת הקושי שלה.'});
 c.body.append(h(DIFF_CARD));
 c.body.append(h(`<div class="pil"><div id="itm"></div><div class="feed"><h4><span>מה אמרו בכיתה</span><span>20 טירונים</span></h4>
  <div class="msg good"><div class="a">ד</div><div class="b"><small>דניאל</small>בראש הדף היה כתוב כמה זמן יש ואיך מסמנים. ידעתי בדיוק מה מצופה ממני.</div></div>
  <div class="msg good"><div class="a" style="background:#CFE5BE">י</div><div class="b"><small>יובל</small>בשאלה על נפוליאון ידעתי בדיוק מה שואלים.</div></div>
  <div class="hist"><b>התפלגות ציונים (להמחשה)</b><div class="bars"><div><i style="height:10px"></i>40</div><div><i style="height:20px"></i>50</div><div><i style="height:40px"></i>60</div><div><i style="height:62px"></i>70</div><div><i style="height:52px"></i>80</div><div><i style="height:22px"></i>90</div></div></div></div></div>`));
 const it=qs('#itm');
 it.append(itemCard({head:'שאלה 7 · השאלה שתיקנת',idx:'1 מתוך 2',q:'"באיזו שנה נולד נפוליאון?"',p:90}));
 await choose(it,{q:'מה אומרת דרגת הקושי?',opts:['השאלה קלה','השאלה קשה'],correct:0,wrong:{1:'90% מהטירונים ענו נכון, ורק 10% לא. רוב החניכים הצליחו בה.'}});
 c.say(4,'נכון. 90% ענו נכון, ולכן השאלה קלה. והפעם הם הצליחו כי ברור מה שואלים.');
 addRule('פיילוט','דרגת קושי = אחוז העונים נכון. 90% ענו נכון: שאלה קלה',it);
 nextBtn(c.after,'לשאלה הבאה','',['{בדקת|בדקת} את דרגת הקושי של השאלה שתיקנת: 90% ענו נכון, שאלה קלה.','שאלה שנייה בפיילוט, הפעם מהמאגר הישן.']);
}
async function scrPilot2(){
 const c=stage({act:'ג',step:7,title:'הערכה ובקרה',sub:'ניתוח פריטי המבחן',icon:'7',pose:7,
  say:'רגע לפני הפיילוט צירפתי שאלה מהמאגר הישן, ש{לא הספקת|לא הספקת} לעבור עליה. {תסתכל|תסתכלי} מה קרה.'});
 c.body.append(h(`<div class="pil"><div id="itm"></div><div class="feed evid"><h4><span>מה אמרו בכיתה</span><span>על שאלה 4</span></h4>
  <div class="msg"><div class="a" style="background:#F2C4B3">ע</div><div class="b"><small>עומר</small>קראתי פעמיים ועדיין לא הבנתי אם "חוסר" ו"לא" מבטלים אחד את השני.</div></div>
  <div class="msg"><div class="a" style="background:#CFE5BE">ש</div><div class="b"><small>שירה</small>ידעתי את החומר, אבל התבלבלתי מהניסוח.</div></div>
  <div class="msg"><div class="a">ת</div><div class="b"><small>תום</small>פשוט ניחשתי.</div></div></div></div>`));
 const it=qs('#itm');
 it.append(itemCard({head:'שאלה 4 · מהמאגר הישן',idx:'2 מתוך 2',q:'"חוסר התאמה בין מטרות הוראה למטרות בחינה לא יגרום לפגיעה ברמת התקפות של שאלון בחינה." נכון / לא נכון',p:25}));
 await choose(it,{q:'מה אומרת דרגת הקושי?',opts:['השאלה קלה','השאלה קשה'],correct:1,wrong:{0:'רק 25% ענו נכון. שלושה מכל ארבעה טירונים טעו.'}});
 c.say(3,'נכון, שאלה קשה. אבל למה היא קשה? {קרא|קראי} מה אמרו בכיתה.');
 const a=h('<div></div>');it.append(a);
 await choose(a,{q:'מה עושים עם השאלה?',opts:['בודקים את הניסוח ומתקנים את השאלה','משאירים: שאלה קשה היא סימן למבחן טוב','מורידים את הנושא מהמבחן'],correct:0,cols:1,
  wrong:{1:'מבחן יכול להיות קשה, אבל הוגן. כאן הטירונים נכשלו בגלל הניסוח, לא בגלל החומר.',2:'הנושא נלמד ושייך למבחן (מיצוי). הבעיה בניסוח, לא בנושא.'}});
 c.say(6,'בדיוק. הקושי כאן בא מהשלילה הכפולה, לא מהחומר. מתקנים את הניסוח ובודקים שוב.');
 addRule('הערכה ובקרה','שאלה קשה בגלל ניסוח ולא בגלל החומר: מתקנים אותה',a);
 nextBtn(c.after,'לסיום','את הפיילוט וההערכה והבקרה לומדים לעומק בשיעור מבחן מעשי.',['{זיהית|זיהית} שאלה קשה בגלל ניסוח, ו{החלטת|החלטת} לתקן אותה.','סיום: עיקרי השיעור.']);
}

/* ===================== EPILOGUE ===================== */
const SUMMARY=[
 ['מבחן תקף',['מיצוי: בוחן את כל החומר','פרופורציונלי: לנושא קריטי יותר שאלות','בלבדיות: רק מה שנלמד','מותאם לרמת הקושי של התחום ושל הנבחנים']],
 ['שבעת השלבים',['עץ נושאים ← רמת למידה ← כמות שאלות ← חיבור פריטים ← הוראות ← פיילוט ← הערכה ובקרה']],
 ['רב ברירה',['מסד עצמאי וברור, עם שאלה אחת בלבד','מנסחים בחיוב. שלילה מדגישים','תשובה נכונה אחת, בלי תשובות נכונות חלקית','מסיחים מהימנים, בלי זוג מנוגד ובלי שני מסיחים זהים']],
 ['נכון / לא נכון',['עובדה אחת בכל היגד','בלי שלילה כפולה ובלי מושגי זמן לא מוגדרים']],
 ['התאמה, סדר, השלמה, קלוז, זיהוי',['התאמה: מספר שונה של פריטים בטורים, 5–12 סעיפים, כותרות וצורת התאמה','סדר מחדש: לא ממספרים מראש','השלמה: בלי רמזים, מילה חסרה באמצע או בסוף, יחידת מידה','קלוז: 200–300 מילים, מילה מושמטת לכל 6 לכל היותר','זיהוי: סימון המקומות והפניה מדויקת']],
 ['שאלה פתוחה',['ממוקדת וחד-משמעית, עם מילות הוראה (פרט, הסבר, השווה) והגבלות']],
 ['ניקוד והוראות',['יותר נקודות לתוכן עיקרי, לרמה גבוהה ולפריט תובעני','הוראות: משך (כולל הארכה), בסיס ידע, קריטריונים, בחירה, שיטוט, סימון וניקוד']],
 ['פיילוט',['דרגת קושי = אחוז העונים נכון','שאלה קשה בגלל ניסוח: מתקנים']]
];
function scrEnd(){
 const c=stage({long:true,act:'ג',step:8,title:'המחזור הבא נכנס לכיתה',sub:'והפעם המבחן הוגן',icon:'★',pose:6,
  say:'כל הכבוד, {name}. זוכר{|ת} את כיתה י"א? אצלך אף טירון לא ייפול בגלל ניסוח.'});
 const fv=fair();
 c.body.append(h(`<div class="ep" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="big"><b>מד הוגנות</b><span>${fv===null?'—':fv+'%'}</span><small style="display:block;font-size:12.5px;color:var(--muted)">תשובות נכונות בניסיון הראשון</small></div>
  <div class="big"><b>צלקות שתוקנו</b><span>${S.fixed.length} / 6</span><small style="display:block;font-size:12.5px;color:var(--muted)">מכיתה י"א</small></div></div>`));
 c.body.append(h(`<div class="cheat"><h3>עיקרי השיעור · כתיבת מבחן עיוני</h3>${SUMMARY.map(([t,xs])=>`<div class="grp"><b>${t}</b><ul>${xs.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`));
 const canPrint=(()=>{try{return window.self===window.top}catch(e){return false}})();
 const w=h(`<div class="next3"><span></span><div style="display:flex;gap:10px;flex-wrap:wrap">${canPrint?'<button class="btn ghost" id="pr">הדפסת הסיכום</button>':''}<button class="btn" id="rs">להתחיל מחדש</button></div></div>`);
 c.after.append(w);
 if(canPrint)qs('#pr',w).onclick=()=>window.print();
 qs('#rs',w).onclick=()=>{const keep={name:S.name,g:S.g,role:S.role};S=Object.assign(fresh(),keep);save();render()};
}

/* ===================== ENTRY ===================== */
function scrEntry(){
 app.innerHTML='';
 const resume=S.i>0;
 const el=h(`<div class="entry"><div class="content">
  <div class="eyebrow">סדנת מבחנים · כתיבת מבחן עיוני</div>
  <h1>שני צדדים<br>של <em>אותו דף</em></h1>
  <p class="lead">פעם ישבת מול מבחן שהוריד לך נקודות בגלל ניסוח, לא בגלל ידע. היום, את/ה כותב/ת אותו.</p>
  <div class="form">
   <div class="field"><label for="nm">איך קוראים לך?</label><input class="input" id="nm" maxlength="20" autocomplete="off" value="${esc(S.name)}" placeholder="שם פרטי"></div>
   <div class="row2"><div class="field"><span class="lbl">לשון פנייה</span><div class="seg" id="sg"><button data-v="m">זכר</button><button data-v="f">נקבה</button></div></div>
   <div class="field"><span class="lbl">תפקיד</span><div class="seg" id="sr"><button data-v="off">קצין/ת צפ"ה</button><button data-v="nco">מש"ק/ית צפ"ה</button></div></div></div>
  </div>
  ${resume?`<div class="resume"><b>יש לך התקדמות שמורה.</b><button class="btn" id="cont">להמשיך מאיפה שעצרתי ${ARROW}</button><button class="btn ghost" id="anew">להתחיל מחדש</button></div>`:''}
  <div class="start">${resume?'':`<button class="btn" id="go">יאללה, מתחילים ${ARROW}</button>`}<span class="time">כ־35 דקות · ההתקדמות נשמרת בדפדפן</span></div>
 </div>
 <div class="art" aria-hidden="true">
  <div class="sheet old"><div class="h">מבחן בהיסטוריה</div><div class="grade">54</div><div class="scrib">1. דוד בן גוריון: <span class="x">✗</span><br>2. 1789? צרפת?<br>3. ...<br>4. כל התשובות נכונות <span class="x">✗</span><br>5. ___ הוא ההר הגבוה<br>6. לא היה בחומר!!</div></div>
  <div class="sheet new"><span class="tag">טיוטה · מבחן עיוני</span><h3>מבחן M16 · סוף טירונות</h3><div class="meta">משך הבחינה: ___ דק' · בסיס הידע: החומר שנלמד בקורס</div><div class="bar" style="width:92%"></div><div class="bar" style="width:70%"></div><div class="qline"><i>✓</i> מסד עצמאי וברור</div><div class="qline"><i>✓</i> תשובה נכונה אחת בלבד</div><div class="qline"><i>✓</i> מסיחים מהימנים</div><div class="bar" style="width:76%;margin-top:16px"></div></div>
  <div class="journey"><div><b>מערכה א'</b><span>פלאשבק: כיתה י"א</span><small>נבחנים במבחן גרוע</small></div><div><b>מערכה ב'</b><span>עכשיו את/ה כותב/ת</span><small>7 שלבים לבניית מבחן</small></div><div><b>מערכה ג'</b><span>הפיילוט</span><small>20 חניכים פותרים</small></div></div>
 </div></div>`.replace(/\{/g,'&#123;'));
 app.append(el);
 const sel=(id,key)=>{const box=qs(id,el);const paint=()=>box.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===S[key]));paint();box.onclick=e=>{const b=e.target.closest('button');if(!b)return;S[key]=b.dataset.v;paint();save()}};
 sel('#sg','g');sel('#sr','role');
 const nm=qs('#nm',el);nm.oninput=()=>{S.name=nm.value.trim();save()};
 const go=()=>{if(!S.name){nm.focus();nm.style.borderColor='var(--coral-d)';nm.placeholder='נא להזין שם';return}S.i=1;save();render()};
 if(qs('#go',el))qs('#go',el).onclick=go;
 if(qs('#cont',el))qs('#cont',el).onclick=()=>{if(!S.name){nm.focus();return}render(true)};
 if(qs('#anew',el))qs('#anew',el).onclick=()=>{const keep={name:S.name,g:S.g,role:S.role};S=Object.assign(fresh(),keep);save();render()};
}

/* ===================== FLOW ===================== */
function buildScreens(){
 return [scrEntry,scrAIntro,...EXAM.map((_,k)=>()=>scrAQ(k)),scrADebrief,scrTrans,scrB0,scrB1,scrB2,scrB3,scrB4,scrB5,scrB6,
  ...mcDrafts(),...tfScreens(),...otherTypes(),scrScore,scrInstr,scrPilot1,scrPilot2,scrEnd];
}
let entryShown=false;
function render(forceIdx){
 TIMERS.forEach(clearTimeout);TIMERS=[];NTH=0;document.querySelectorAll('.timeup,.modal').forEach(x=>x.remove());
 const list=buildScreens();
 if(S.i>=list.length)S.i=list.length-1;
 if(!entryShown&&S.i>0&&!forceIdx){entryShown=true;scrEntry();return}
 entryShown=true;
 window.scrollTo(0,0);
 const r=list[S.i]();if(r&&r.catch)r.catch(e=>console.error(e));
}
function next(){S.i++;save();render(true)}
render();
</script>
